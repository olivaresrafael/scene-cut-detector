<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63a0ff"/>
      <stop offset="1" stop-color="#2f6fdd"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3677e6"/>
      <stop offset="1" stop-color="#2b66cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123a7a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="146" width="356" height="220" rx="30" fill="#ffffff"/>
    <g fill="#2f6fdd">
      <rect x="100" y="160" width="30" height="22" rx="6"/>
      <rect x="156" y="160" width="30" height="22" rx="6"/>
      <rect x="212" y="160" width="30" height="22" rx="6"/>
      <rect x="268" y="160" width="30" height="22" rx="6"/>
      <rect x="324" y="160" width="30" height="22" rx="6"/>
      <rect x="380" y="160" width="30" height="22" rx="6"/>

      <rect x="100" y="330" width="30" height="22" rx="6"/>
      <rect x="156" y="330" width="30" height="22" rx="6"/>
      <rect x="212" y="330" width="30" height="22" rx="6"/>
      <rect x="268" y="330" width="30" height="22" rx="6"/>
      <rect x="324" y="330" width="30" height="22" rx="6"/>
      <rect x="380" y="330" width="30" height="22" rx="6"/>
    </g>
  </g>

  <!-- Zig-zag cut through the strip -->
  <path d="M262 138 L226 196 L284 240 L232 292 L272 346 L250 380"
        fill="none" stroke="url(#cut)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparks -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95">
    <path d="M318 118 L342 94"/>
    <path d="M352 146 L384 138"/>
    <path d="M300 92 L300 62"/>
  </g>
</svg>
